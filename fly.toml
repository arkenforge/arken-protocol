# fly.toml app configuration file generated for arken-protocol on 2026-10-29T08:20:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arken-protocol'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.demo'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
