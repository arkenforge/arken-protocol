<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-label="Arken Auth challenge-response flow diagram">
  <defs>
    <marker id="fl-r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L0,6.5 L6,3.5 z" fill="#1A1A1A"/>
    </marker>
    <marker id="fl-l" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M6,0.5 L6,6.5 L0,3.5 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect width="860" height="310" fill="#FFFFFF"/>

  <!-- Client box -->
  <rect x="30" y="18" width="130" height="36" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 4" stroke-linecap="round"/>
  <text x="95" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">Client</text>

  <!-- Server box -->
  <rect x="700" y="18" width="130" height="36" rx="3" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 4" stroke-linecap="round"/>
  <text x="765" y="41" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">Server</text>

  <!-- Lifelines -->
  <line x1="95" y1="54" x2="95" y2="298" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="0.1 5" stroke-linecap="round" opacity="0.35"/>
  <line x1="765" y1="54" x2="765" y2="298" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="0.1 5" stroke-linecap="round" opacity="0.35"/>

  <!-- Arrow 1: GET /protected → -->
  <line x1="102" y1="88" x2="757" y2="88" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 5" stroke-linecap="round" marker-end="url(#fl-r)"/>
  <text x="200" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#1A1A1A">GET /protected</text>
  <text x="200" y="101" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#1A1A1A" opacity="0.55">(no Authorization header)</text>

  <!-- Arrow 2: 401 ← -->
  <line x1="758" y1="148" x2="102" y2="148" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 5" stroke-linecap="round" marker-end="url(#fl-l)"/>
  <text x="200" y="142" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#1A1A1A">401  { challenge: { nonce, statement } }</text>

  <!-- Sign note -->
  <rect x="30" y="170" width="200" height="32" rx="3" fill="none" stroke="#D89A2B" stroke-width="1" stroke-dasharray="0.1 4" stroke-linecap="round" opacity="0.7"/>
  <text x="130" y="190" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#8F6310" text-anchor="middle">sign(nonce, privateKey)</text>

  <!-- Arrow 3: signed request → -->
  <line x1="102" y1="232" x2="757" y2="232" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 5" stroke-linecap="round" marker-end="url(#fl-r)"/>
  <text x="140" y="222" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#1A1A1A">GET /protected</text>
  <text x="140" y="238" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#1A1A1A" opacity="0.75">Authorization: Signature did="…",nonce="…",signature="…"</text>

  <!-- Arrow 4: 200 ← -->
  <line x1="758" y1="278" x2="102" y2="278" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="0.1 5" stroke-linecap="round" marker-end="url(#fl-l)"/>
  <text x="200" y="272" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#1A1A1A">200  { did: "did:key:zQ3s…" }</text>
</svg>
