<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="arken/auth — The server holds nothing.">
  <defs>
    <!-- Halftone patterns for stone (bl = banner light) -->
    <pattern id="blSparse" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1" fill="#1A1A1A"/></pattern>
    <pattern id="blMid" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#1A1A1A"/></pattern>
    <pattern id="blDense" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="2.25" cy="2.25" r="1.45" fill="#1A1A1A"/></pattern>
    <pattern id="blChecker" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#1A1A1A"/><rect x="3" y="3" width="3" height="3" fill="#1A1A1A"/></pattern>
    <pattern id="blFaint" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="0.9" fill="#1A1A1A"/></pattern>
    <pattern id="blOpal" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#6FA8C9"/></pattern>
    <pattern id="blRose" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="2.25" cy="2.25" r="1.5" fill="#DE8F7A"/></pattern>
    <pattern id="blGold" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#D89A2B"/></pattern>
    <!-- Ground line dots -->
    <pattern id="blGround" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1" fill="#1A1A1A" opacity="0.3"/></pattern>
  </defs>

  <!-- White background -->
  <rect width="1280" height="400" fill="#FFFFFF"/>

  <!-- Left panel: wordmark and headline -->
  <!-- Wordmark: arken -->
  <text x="100" y="162" font-family="JetBrains Mono, ui-monospace, monospace" font-size="52" font-weight="300" fill="#1A1A1A" letter-spacing="-1">arken</text>
  <!-- Wordmark: /auth in Hoard Gold -->
  <text x="286" y="162" font-family="JetBrains Mono, ui-monospace, monospace" font-size="52" font-weight="300" fill="#8F6310" letter-spacing="-1">/auth</text>

  <!-- Headline -->
  <text x="100" y="232" font-family="Instrument Serif, Georgia, serif" font-size="46" fill="#1A1A1A">The server</text>
  <text x="100" y="290" font-family="Instrument Serif, Georgia, serif" font-size="46" fill="#1A1A1A">holds nothing.</text>

  <!-- Thin divider under wordmark -->
  <line x1="100" y1="176" x2="560" y2="176" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="0.1 4" stroke-linecap="round" opacity="0.25"/>

  <!-- Right panel: Arken stone, centered at (1045, 200), scale 0.82 -->
  <g transform="translate(1045,200) scale(0.82) translate(-1200,-240)">
    <!-- Glow rays -->
    <g stroke="#D89A2B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 7" fill="none">
      <line x1="1200" y1="70" x2="1200" y2="14"/>
      <line x1="1285" y1="93" x2="1315" y2="41"/>
      <line x1="1347" y1="155" x2="1399" y2="125"/>
      <line x1="1370" y1="240" x2="1430" y2="240"/>
      <line x1="1347" y1="325" x2="1399" y2="355"/>
      <line x1="1053" y1="155" x2="1001" y2="125"/>
      <line x1="1030" y1="240" x2="970" y2="240"/>
      <line x1="1053" y1="325" x2="1001" y2="355"/>
      <line x1="1115" y1="93" x2="1085" y2="41"/>
    </g>
    <!-- Stone faces -->
    <polygon points="1200,170 1249.5,190.5 1270,240 1249.5,289.5 1200,310 1150.5,289.5 1130,240 1150.5,190.5" fill="url(#blFaint)"/>
    <polygon points="1270,240 1249.5,289.5 1338.6,297.4" fill="url(#blOpal)"/>
    <polygon points="1249.5,289.5 1200,310 1257.4,378.6" fill="url(#blDense)"/>
    <polygon points="1200,310 1150.5,289.5 1142.6,378.6" fill="url(#blMid)"/>
    <polygon points="1150.5,289.5 1130,240 1061.4,297.4" fill="url(#blSparse)"/>
    <polygon points="1130,240 1150.5,190.5 1061.4,182.6" fill="url(#blFaint)"/>
    <polygon points="1150.5,190.5 1200,170 1142.6,101.4" fill="url(#blGold)"/>
    <polygon points="1200,170 1249.5,190.5 1257.4,101.4" fill="url(#blMid)"/>
    <polygon points="1249.5,190.5 1270,240 1338.6,182.6" fill="url(#blChecker)"/>
    <polygon points="1338.6,182.6 1338.6,297.4 1270,240" fill="url(#blDense)"/>
    <polygon points="1338.6,297.4 1257.4,378.6 1249.5,289.5" fill="url(#blRose)"/>
    <polygon points="1257.4,378.6 1142.6,378.6 1200,310" fill="url(#blDense)"/>
    <polygon points="1142.6,378.6 1061.4,297.4 1150.5,289.5" fill="url(#blMid)"/>
    <polygon points="1061.4,297.4 1061.4,182.6 1130,240" fill="url(#blMid)"/>
    <polygon points="1061.4,182.6 1142.6,101.4 1150.5,190.5" fill="url(#blSparse)"/>
    <polygon points="1142.6,101.4 1257.4,101.4 1200,170" fill="url(#blMid)"/>
    <polygon points="1257.4,101.4 1338.6,182.6 1249.5,190.5" fill="url(#blDense)"/>
    <!-- Stone outlines -->
    <g stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 5" fill="none">
      <polygon points="1338.6,297.4 1257.4,378.6 1142.6,378.6 1061.4,297.4 1061.4,182.6 1142.6,101.4 1257.4,101.4 1338.6,182.6"/>
      <polygon points="1200,170 1249.5,190.5 1270,240 1249.5,289.5 1200,310 1150.5,289.5 1130,240 1150.5,190.5"/>
    </g>
    <!-- Gold flecks -->
    <rect x="1188" y="228" width="10" height="10" fill="#D89A2B"/>
    <rect x="1206" y="246" width="6" height="6" fill="#D89A2B"/>
  </g>

  <!-- Ground line (dotted, sparse) under the stone -->
  <rect x="800" y="358" width="440" height="6" fill="url(#blGround)"/>
</svg>
