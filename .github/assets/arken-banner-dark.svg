<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="arken/auth — The server holds nothing.">
  <defs>
    <!-- Halftone patterns for stone (bd = banner dark) -->
    <pattern id="bdSparse" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1" fill="#EDEDED"/></pattern>
    <pattern id="bdMid" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#EDEDED"/></pattern>
    <pattern id="bdDense" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="2.25" cy="2.25" r="1.45" fill="#EDEDED"/></pattern>
    <pattern id="bdChecker" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#EDEDED"/><rect x="3" y="3" width="3" height="3" fill="#EDEDED"/></pattern>
    <pattern id="bdFaint" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="0.9" fill="#EDEDED"/></pattern>
    <pattern id="bdOpal" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#6FA8C9"/></pattern>
    <pattern id="bdRose" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="2.25" cy="2.25" r="1.5" fill="#DE8F7A"/></pattern>
    <pattern id="bdGold" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#D89A2B"/></pattern>
    <!-- Ground line dots -->
    <pattern id="bdGround" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1" fill="#EDEDED" opacity="0.3"/></pattern>
  </defs>

  <!-- No background — transparent for GitHub dark theme -->

  <!-- Left panel: wordmark and headline -->
  <text x="100" y="162" font-family="JetBrains Mono, ui-monospace, monospace" font-size="52" font-weight="300" fill="#EDEDED" letter-spacing="-1">arken</text>
  <!-- /auth in Torchlight on dark -->
  <text x="286" y="162" font-family="JetBrains Mono, ui-monospace, monospace" font-size="52" font-weight="300" fill="#D89A2B" letter-spacing="-1">/auth</text>

  <!-- Headline -->
  <text x="100" y="232" font-family="Instrument Serif, Georgia, serif" font-size="46" fill="#EDEDED">The server</text>
  <text x="100" y="290" font-family="Instrument Serif, Georgia, serif" font-size="46" fill="#EDEDED">holds nothing.</text>

  <!-- Thin divider -->
  <line x1="100" y1="176" x2="560" y2="176" stroke="#EDEDED" stroke-width="1" stroke-dasharray="0.1 4" stroke-linecap="round" opacity="0.2"/>

  <!-- Right panel: Arken stone -->
  <g transform="translate(1045,200) scale(0.82) translate(-1200,-240)">
    <g stroke="#D89A2B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 7" fill="none">
      <line x1="1200" y1="70" x2="1200" y2="14"/>
      <line x1="1285" y1="93" x2="1315" y2="41"/>
      <line x1="1347" y1="155" x2="1399" y2="125"/>
      <line x1="1370" y1="240" x2="1430" y2="240"/>
      <line x1="1347" y1="325" x2="1399" y2="355"/>
      <line x1="1053" y1="155" x2="1001" y2="125"/>
      <line x1="1030" y1="240" x2="970" y2="240"/>
      <line x1="1053" y1="325" x2="1001" y2="355"/>
      <line x1="1115" y1="93" x2="1085" y2="41"/>
    </g>
    <polygon points="1200,170 1249.5,190.5 1270,240 1249.5,289.5 1200,310 1150.5,289.5 1130,240 1150.5,190.5" fill="url(#bdFaint)"/>
    <polygon points="1270,240 1249.5,289.5 1338.6,297.4" fill="url(#bdOpal)"/>
    <polygon points="1249.5,289.5 1200,310 1257.4,378.6" fill="url(#bdDense)"/>
    <polygon points="1200,310 1150.5,289.5 1142.6,378.6" fill="url(#bdMid)"/>
    <polygon points="1150.5,289.5 1130,240 1061.4,297.4" fill="url(#bdSparse)"/>
    <polygon points="1130,240 1150.5,190.5 1061.4,182.6" fill="url(#bdFaint)"/>
    <polygon points="1150.5,190.5 1200,170 1142.6,101.4" fill="url(#bdGold)"/>
    <polygon points="1200,170 1249.5,190.5 1257.4,101.4" fill="url(#bdMid)"/>
    <polygon points="1249.5,190.5 1270,240 1338.6,182.6" fill="url(#bdChecker)"/>
    <polygon points="1338.6,182.6 1338.6,297.4 1270,240" fill="url(#bdDense)"/>
    <polygon points="1338.6,297.4 1257.4,378.6 1249.5,289.5" fill="url(#bdRose)"/>
    <polygon points="1257.4,378.6 1142.6,378.6 1200,310" fill="url(#bdDense)"/>
    <polygon points="1142.6,378.6 1061.4,297.4 1150.5,289.5" fill="url(#bdMid)"/>
    <polygon points="1061.4,297.4 1061.4,182.6 1130,240" fill="url(#bdMid)"/>
    <polygon points="1061.4,182.6 1142.6,101.4 1150.5,190.5" fill="url(#bdSparse)"/>
    <polygon points="1142.6,101.4 1257.4,101.4 1200,170" fill="url(#bdMid)"/>
    <polygon points="1257.4,101.4 1338.6,182.6 1249.5,190.5" fill="url(#bdDense)"/>
    <g stroke="#EDEDED" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 5" fill="none">
      <polygon points="1338.6,297.4 1257.4,378.6 1142.6,378.6 1061.4,297.4 1061.4,182.6 1142.6,101.4 1257.4,101.4 1338.6,182.6"/>
      <polygon points="1200,170 1249.5,190.5 1270,240 1249.5,289.5 1200,310 1150.5,289.5 1130,240 1150.5,190.5"/>
    </g>
    <rect x="1188" y="228" width="10" height="10" fill="#D89A2B"/>
    <rect x="1206" y="246" width="6" height="6" fill="#D89A2B"/>
  </g>

  <!-- Ground line -->
  <rect x="800" y="358" width="440" height="6" fill="url(#bdGround)"/>
</svg>
