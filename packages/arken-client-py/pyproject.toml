[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "arken-client"
version = "0.1.0"
description = "Client SDK for arken-auth — handles the a401 challenge-response flow automatically."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["arken", "did", "authentication", "a401", "agent"]
dependencies = [
    "httpx>=0.25.0",
    "eth-account>=0.10.0",
    "eth-keys>=0.4.0",
    "base58>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/ArkenAuth/arken-protocol"
Repository = "https://github.com/ArkenAuth/arken-protocol"

[tool.setuptools.packages.find]
where = ["."]
include = ["arken_client*"]
