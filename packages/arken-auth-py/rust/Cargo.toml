[package]
name = "arken_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "arken_core"
crate-type = ["cdylib"]

[dependencies]
ethers      = { version = "2.0", features = ["rustls"] }
serde_json  = "1.0"
rand        = "0.8"
lazy_static = "1.4.0"
libc        = "0.2"
thiserror   = "1.0"
tokio       = { version = "1", features = ["full"] }
bs58        = "0.5"
